# Fly.io Configuration for PocketBase CMS
# App Name will be automatically assigned or chosen during 'fly launch'

primary_region = "iad"

[build]
  image = "ghcr.io/muchweb/pocketbase:latest"

[mounts]
  source = "pb_data"
  destination = "/pb/pb_data"

[http_service]
  internal_port = 8090
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "get"
  path = "/api/health"
  timeout = "2s"
