version: '3.8'

services:
  pocketbase:
    image: ghcr.io/muchweb/pocketbase:latest
    container_name: pocketbase-cms
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./pb_data:/pb/pb_data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
