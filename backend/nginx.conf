# Nginx Reverse Proxy Configuration for PocketBase on HTTPS
# Place this file in /etc/nginx/sites-available/pocketbase.conf
# Replace 'api.yourdomain.com' with your actual domain or subdomain.

server {
    listen 80;
    server_name api.yourdomain.com;

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }

    # Certbot ACME Challenge Path
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
}

server {
    listen 443 ssl http2;
    server_name api.yourdomain.com;

    # SSL Certificates managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Client upload size limit (for images & attachments)
    client_max_body_size 25M;

    # Reverse Proxy to PocketBase Docker container
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        # WebSockets & Server-Sent Events (SSE) support for real-time PocketBase subscriptions
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for streaming/long-polling
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
